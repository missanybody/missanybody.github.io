<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Librerías necesarias -->
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: imagenes/marcadores_finales.mind; maxTrack: 4"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <!-- Recursos locales -->
      <a-assets>
        <img id="fotoVaca" src="imagenes/foto_vaca.jpeg" />
        <video id="videoMar" src="imagenes/mar.mp4" playsinline></video>
        <video id="videoConcierto" src="imagenes/concierto.mp4" playsinline></video>
        <audio id="audioRecuerdo" src="imagenes/audio.mp3" preload="auto"></audio>
        <!-- Ícono de play -->
        <img id="iconPlay" src="imagenes/play_icon.png" />
      </a-assets>

      <!-- Cámara -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Primer marcador: imagen -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-image src="#fotoVaca" position="0 0 0" scale="1 1 1"></a-image>
      </a-entity>

      <!-- Segundo marcador: video mar -->
      <a-entity mindar-image-target="targetIndex: 1" id="marcadorMar">
        <a-video src="#videoMar" position="0 0 0" width="1.6" height="0.9"></a-video>
        <a-image class="overlay" src="#iconPlay" position="0 0 0.01" width="0.3" height="0.3" visible="true"></a-image>
      </a-entity>

      <!-- Tercer marcador: video concierto -->
      <a-entity mindar-image-target="targetIndex: 2" id="marcadorConcierto">
        <a-video src="#videoConcierto" position="0 0 0" width="1.6" height="0.9"></a-video>
        <a-image class="overlay" src="#iconPlay" position="0 0 0.01" width="0.3" height="0.3" visible="true"></a-image>
      </a-entity>

      <!-- Cuarto marcador: audio -->
      <a-entity mindar-image-target="targetIndex: 3" id="marcadorAudio"></a-entity>
    </a-scene>

    <script>
      // Función genérica para manejar videos con overlay
      function setupVideo(marcadorId, videoId) {
        const marcador = document.querySelector(marcadorId);
        const video = document.querySelector(videoId);
        const overlay = marcador.querySelector(".overlay");

        marcador.addEventListener("targetFound", () => {
          overlay.setAttribute("visible", true);
          document.body.addEventListener("click", () => {
            video.play();
            overlay.setAttribute("visible", false);
          }, { once: true });
        });

        marcador.addEventListener("targetLost", () => {
          video.pause();
          video.currentTime = 0;
          overlay.setAttribute("visible", true);
        });
      }

      // Configurar todos los videos
      setupVideo("#marcadorMar", "#videoMar");
      setupVideo("#marcadorConcierto", "#videoConcierto");

      // Audio
      const audio = document.querySelector("#audioRecuerdo");
      const marcadorAudio = document.querySelector("#marcadorAudio");
      marcadorAudio.addEventListener("targetFound", () => {
        audio.play();
      });
      marcadorAudio.addEventListener("targetLost", () => {
        audio.pause();
        audio.currentTime = 0;
      });
    </script>
  </body>
</html>
