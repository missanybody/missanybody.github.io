<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Librerías necesarias -->
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: imagenes/marcadoress.mind; maxTrack: 3"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <!-- Recursos -->
      <a-assets>
        <video id="recuerdoVideo" src="imagenes/pvideo.mp4" autoplay loop muted playsinline></video>
        <img id="recuerdoImg" src="imagenes/vaca.jpeg" />
      </a-assets>

      <!-- Cámara -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Primer marcador: muestra el video -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#recuerdoVideo" position="0 0 0" scale="1 1 1"></a-video>
      </a-entity>

      <!-- Segundo marcador: muestra la imagen -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-image src="#recuerdoImg" position="0 0 0" scale="1 1 1"></a-image>
      </a-entity>

      <!-- Tercer marcador: abre la página web -->
      <a-entity mindar-image-target="targetIndex: 2" id="marcadorYoutube"></a-entity>
    </a-scene>

    <script>
      // Cuando se detecta el tercer marcador, redirige a YouTube
      document.querySelector("#marcadorYoutube").addEventListener("targetFound", () => {
        window.location.href = "https://www.youtube.com/watch?v=hvi3J3yBRXI";
      });
    </script>
  </body>
</html>
