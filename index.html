<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Librerías necesarias -->
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: imagenes/marcado.mind; maxTrack: 3"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <!-- Recursos locales -->
      <a-assets>
        <img id="recuerdoImg" src="imagenes/vaca.jpeg" />
        <!-- Video SIN autoplay ni muted -->
        <video id="recuerdoVideo" src="imagenes/pvideo.mp4" playsinline></video>
      </a-assets>

      <!-- Cámara -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Primer marcador: video local -->
      <a-entity mindar-image-target="targetIndex: 0" id="marcadorVideo">
        <a-video src="#recuerdoVideo" position="0 0 0" scale="1 1 1"></a-video>
      </a-entity>

      <!-- Segundo marcador: imagen -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-image src="#recuerdoImg" position="0 0 0" scale="1 1 1"></a-image>
      </a-entity>

      <!-- Tercer marcador: abre YouTube -->
      <a-entity mindar-image-target="targetIndex: 2" id="marcadorYoutube"></a-entity>
    </a-scene>

    <script>
      // Video con audio: se reproduce al tocar la pantalla cuando el marcador aparece
      const video = document.querySelector("#recuerdoVideo");
      document.querySelector("#marcadorVideo").addEventListener("targetFound", () => {
        // Espera interacción del usuario
        document.body.addEventListener("click", () => {
          video.play();
        }, { once: true });
      });

      // Cuando se detecta el tercer marcador, redirige a YouTube
      document.querySelector("#marcadorYoutube").addEventListener("targetFound", () => {
        window.location.href = "https://www.youtube.com/watch?v=hvi3J3yBRXI";
      });
    </script>
  </body>
</html>
