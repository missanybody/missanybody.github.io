<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Librerías necesarias -->
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: imagenes/marcadores_finales.mind; maxTrack: 4"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <!-- Recursos locales -->
      <a-assets>
        <img id="fotoVaca" src="imagenes/foto_vaca.jpeg" />
        <video id="videoMar" src="imagenes/mar.mp4" playsinline></video>
        <video id="videoConcierto" src="imagenes/concierto.mp4" playsinline></video>
        <audio id="audioRecuerdo" src="imagenes/audio.mp3" preload="auto"></audio>
      </a-assets>

      <!-- Cámara -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Primer marcador: imagen -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-image src="#fotoVaca" position="0 0 0" scale="1 1 1"></a-image>
      </a-entity>

      <!-- Segundo marcador: video mar en horizontal -->
      <a-entity mindar-image-target="targetIndex: 1" id="marcadorMar">
        <a-video src="#videoMar" position="0 0 0" width="1.6" height="0.9"></a-video>
      </a-entity>

      <!-- Tercer marcador: video concierto en horizontal -->
      <a-entity mindar-image-target="targetIndex: 2" id="marcadorConcierto">
        <a-video src="#videoConcierto" position="0 0 0" width="1.6" height="0.9"></a-video>
      </a-entity>

      <!-- Cuarto marcador: audio -->
      <a-entity mindar-image-target="targetIndex: 3" id="marcadorAudio"></a-entity>
    </a-scene>

    <script>
      // Reproducir video "mar" con interacción
      const videoMar = document.querySelector("#videoMar");
      document.querySelector("#marcadorMar").addEventListener("targetFound", () => {
        document.body.addEventListener("click", () => {
          videoMar.play();
        }, { once: true });
      });

      // Reproducir video "concierto" con interacción
      const videoConcierto = document.querySelector("#videoConcierto");
      document.querySelector("#marcadorConcierto").addEventListener("targetFound", () => {
        document.body.addEventListener("click", () => {
          videoConcierto.play();
        }, { once: true });
      });

      // Reproducir audio automáticamente al detectar el marcador
      const audio = document.querySelector("#audioRecuerdo");
      document.querySelector("#marcadorAudio").addEventListener("targetFound", () => {
        audio.play();
      });
      document.querySelector("#marcadorAudio").addEventListener("targetLost", () => {
        audio.pause();
        audio.currentTime = 0;
      });
    </script>
  </body>
</html>
